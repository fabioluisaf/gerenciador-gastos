server:
  port: ${PORTA_APP}
  shutdown: graceful

spring:
  application:
    name: gerenciador-gastos
  output:
    ansi:
      enabled: always
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": true

springdoc:
  swagger-ui:
    path: /swagger

api:
  versao: ${VERSAO_APP:}

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
