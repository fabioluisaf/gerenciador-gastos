# Configuração comum a todos os ambientes.
# Os valores sensíveis vêm sempre de variáveis de ambiente.
# Sem perfil ativo, valem os padrões seguros (sem Swagger e sem log de SQL).

server:
  port: ${PORTA_APP:8080}
  shutdown: graceful
  # Respeita os cabeçalhos X-Forwarded-* do nginx (o frontend expõe a API em /api)
  forward-headers-strategy: framework

spring:
  application:
    name: gerenciador-gastos
  output:
    ansi:
      enabled: always
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger

api:
  versao: ${VERSAO_APP:}
