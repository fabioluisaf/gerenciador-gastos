server:
  port: ${PORTA_APP}
  shutdown: graceful

spring:
  application:
    name: gerenciador-gastos
  output:
    ansi:
      enabled: always
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger

api:
  versao: ${VERSAO_APP:}

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
